[package]
name = "beams-protocol"
version = "0.1.0"
edition = "2021"

[features]
# Session-bind signature verification, fingerprints, and known_hosts
# matching for the SSH agent proxy (see docs/designs/SSH_AGENT_PROXY_DESIGN.md).
agent-crypto = ["dep:ssh-key", "dep:signature", "dep:hmac", "dep:sha1"]

[dependencies]
serde = { version = "1", features = ["derive"] }
base64ct = { version = "1", features = ["alloc"] }
ssh-key = { version = "0.6", optional = true, default-features = false, features = ["std", "ecdsa", "ed25519", "p256", "p384", "p521", "rsa"] }
signature = { version = "2", optional = true }
hmac = { version = "0.12", optional = true }
sha1 = { version = "0.10", optional = true }

[dev-dependencies]
serde_json = "1"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "p256", "p384", "rand_core", "getrandom"] }
