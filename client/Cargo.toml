[package]
name = "beams"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "beams"
path = "src/main.rs"

[dependencies]
anyhow = "1"
beams-protocol = { path = "../protocol" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
crossterm = "0.29.0"
libc = "0.2"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
signal-hook = "0.3"
vt100 = "0.18.1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
