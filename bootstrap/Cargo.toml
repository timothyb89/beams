[package]
name = "beam-bootstrap"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "beam-bootstrap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
